<!DOCTYPE html>
<html lang="id">
<head>

<title>BUTO FARM — Budidaya Ikan Air Tawar</title>
<style>
:root{--navy:#0b2d43;--navy2:#123f58;--green:#18794e;--green2:#dff3e7;--teal:#1689a5;--ink:#172b36;--muted:#687b85;--bg:#f4f7f6;--line:#e0e8e5;--white:#fff;--amber:#fff2d5;--red:#a83a3a;--shadow:0 12px 32px rgba(10,45,67,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:246px;background:var(--navy);color:#eaf4f5;padding:24px 16px;display:flex;flex-direction:column;z-index:10}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 28px}.logo{width:43px;height:43px;border:2px solid #83d5b0;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#fff;color:var(--navy)}.brand b{font-size:18px;letter-spacing:1.4px;display:block}.brand small{font-size:10px;color:#a8c5ce;letter-spacing:2px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;color:#91b0bb;padding:12px 12px 8px}.nav button{width:100%;display:flex;gap:12px;align-items:center;border:0;color:#c6dbe0;background:transparent;text-align:left;padding:12px;border-radius:10px;margin:2px 0;font-size:13px}.nav button .ico{width:22px;text-align:center;font-size:17px}.nav button.active,.nav button:hover{background:#1c4b5b;color:white}.side-bottom{margin-top:auto;padding:15px 10px;border-top:1px solid #315363;color:#a8c5ce;font-size:11px;line-height:1.6}.main{margin-left:246px;min-height:100vh}.topbar{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--ink)}.top-actions{display:flex;align-items:center;gap:12px}.status-pill{font-size:11px;background:var(--green2);color:var(--green);border-radius:30px;padding:7px 11px;font-weight:700}.avatar{height:34px;width:34px;border-radius:50%;background:#e3f1e9;color:var(--green);display:grid;place-items:center;font-weight:800}.content{padding:30px 32px 50px;max-width:1450px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:1.6px;font-weight:800}.page-head h1{font-size:28px;margin:6px 0 7px;letter-spacing:-.8px}.page-head p{color:var(--muted);margin:0;font-size:13px;line-height:1.6}.btn{border:1px solid var(--line);background:white;color:var(--navy);border-radius:9px;padding:10px 14px;font-size:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.dark{background:var(--navy);color:white;border-color:var(--navy)}.btn.small{padding:7px 10px;font-size:11px}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat,.panel,.product-card,.pond-card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(10,45,67,.025)}.stat{padding:18px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#e7f5ed;font-size:17px}.stat strong{font-size:27px;letter-spacing:-.7px;display:block;margin:14px 0 5px}.stat small{font-size:11px;color:var(--muted)}.dashboard-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}.panel{padding:20px;margin-bottom:18px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel-head h2{font-size:15px;margin:0}.panel-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.text-link{color:var(--green);font-size:11px;font-weight:800;border:0;background:none}.pond-list{display:grid;gap:10px}.pond-row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px}.pond-symbol{height:40px;width:40px;border-radius:10px;background:#e5f3f6;display:grid;place-items:center;font-size:20px}.pond-row b{font-size:12px}.pond-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.tag{font-size:10px;font-weight:800;padding:5px 8px;border-radius:20px;white-space:nowrap}.tag.green{background:#e0f4e7;color:#18794e}.tag.amber{background:var(--amber);color:#936414}.tag.gray{background:#edf1f2;color:#60727a}.bar-wrap{margin:16px 0}.bar-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px}.bar-label span:last-child{color:var(--muted)}.bar{height:8px;border-radius:20px;background:#edf2f1;overflow:hidden}.bar i{height:100%;display:block;border-radius:20px;background:var(--green)}.notice{background:#fff8e8;border:1px solid #f1dfb3;border-radius:11px;padding:13px;display:flex;gap:10px;font-size:11px;color:#765923;line-height:1.55;margin-top:14px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:#f8faf9}th,td{padding:13px 12px;border-bottom:1px solid var(--line)}td{font-size:12px}td strong{font-size:12px}tbody tr:last-child td{border-bottom:0}.fish-name{display:flex;align-items:center;gap:9px}.fish-thumb{width:36px;height:36px;border-radius:9px;background:#e5f3f6;display:grid;place-items:center;font-size:20px}.fish-name small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:11px;color:#526873;font-weight:750}.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #d8e2df;border-radius:8px;padding:10px 11px;background:white;color:var(--ink);outline:none;font-size:12px;min-width:0}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus{border-color:var(--teal);box-shadow:0 0 0 3px #1689a51a}.toolbar input{min-width:190px}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.product-card{overflow:hidden}.product-visual{height:145px;display:grid;place-items:center;font-size:60px;background:linear-gradient(135deg,#dff3e7,#e1f2f5);position:relative}.product-visual.gold{background:linear-gradient(135deg,#fff0c9,#e4f3e5)}.product-visual.brown{background:linear-gradient(135deg,#e9e3d7,#dff1e8)}.product-body{padding:16px}.product-body h3{margin:0 0 5px;font-size:15px}.product-body p{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 14px}.product-meta{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px;font-size:11px}.product-meta span{color:var(--muted)}.product-actions{display:flex;gap:8px;margin-top:14px}.product-actions .btn{flex:1}.empty{padding:36px;text-align:center;color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid .full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#0823339c;z-index:30;display:grid;place-items:center;padding:18px}.modal{background:white;width:min(590px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:24px;box-shadow:0 25px 80px #001b2a44}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:#f0f4f3;border-radius:8px;width:34px;height:34px;font-size:18px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:white;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:50;font-size:12px;max-width:calc(100vw - 44px)}.public-preview{background:var(--navy);color:white;border-radius:15px;padding:25px;margin-bottom:18px;overflow:hidden;position:relative}.public-preview:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:#1a785544;right:-50px;top:-80px}.public-preview>*{position:relative;z-index:1}.public-preview h2{font-size:25px;max-width:500px;line-height:1.18;margin:10px 0}.public-preview p{font-size:12px;color:#c2d9df;max-width:500px;line-height:1.7}.public-preview .eyebrow{color:#8ee0b2}.public-product-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.public-product{background:#ffffff12;border:1px solid #ffffff24;border-radius:10px;padding:14px}.public-product div{font-size:25px}.public-product b{font-size:12px;display:block;margin:7px 0}.public-product small{font-size:10px;color:#c2d9df}.settings-card{max-width:700px}.settings-card .field{margin-bottom:15px}.mobile-menu{display:none}
@media(max-width:1100px){.sidebar{width:210px}.main{margin-left:210px}.content{padding:24px 20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.sidebar{transform:translateX(-100%);transition:transform .2s;width:250px}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.topbar{height:62px;padding:0 16px}.mobile-menu{display:inline-flex}.topbar .crumb{font-size:11px}.content{padding:22px 14px 36px}.page-head{flex-direction:column}.page-head h1{font-size:24px}.stats{gap:10px}.stat{padding:13px}.stat strong{font-size:23px}.stat-top{font-size:10px}.product-grid{grid-template-columns:1fr}.product-visual{height:125px}.public-product-row{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.panel{padding:15px}.pond-row{grid-template-columns:38px 1fr}.pond-row .tag{grid-column:2;justify-self:start}.toolbar input{width:100%;min-width:0}.toolbar>*{flex:1}.status-pill{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">🐟</div><div><b>BUTO FARM</b><small>FRESHWATER AQUACULTURE</small></div></div>
  <div class="nav-label">Workspace</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span> Ringkasan</button>
    <button data-page="ponds"><span class="ico">≋</span> Kolam & Siklus</button>
    <button data-page="stock"><span class="ico">🐟</span> Stok Ikan</button>
    <button data-page="feed"><span class="ico">◉</span> Pakan & Biaya</button>
    <button data-page="harvest"><span class="ico">⚖</span> Panen</button>
    <button data-page="orders"><span class="ico">▤</span> Pesanan & Penjualan</button>
    <button data-page="reports"><span class="ico">▥</span> Laporan</button>
  </nav>
  <div class="nav-label">Website publik</div>
  <nav class="nav"><button data-page="website"><span class="ico">↗</span> Pratinjau Website</button><button data-page="settings"><span class="ico">⚙</span> Pengaturan</button></nav>
  <div class="side-bottom">BUTO FARM · Panel Pemilik<br>Catat rapi, panen lebih terukur.</div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="mobileMenu">☰</button><div class="crumb">BUTO FARM <span style="color:#a8b7bd">/</span> <strong id="crumb">Ringkasan</strong></div></div><div class="top-actions"><span class="status-pill">● Mode demo lokal</span><div class="avatar">BF</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s);
const state={
 page:'dashboard',
 ponds:[
  {id:'K-01',name:'Kolam 01',fish:'Nila',cycle:'Siklus aktif',area:'',count:0,avg:0,status:'Pendataan awal'},
  {id:'K-02',name:'Kolam 02',fish:'Mas',cycle:'Siklus aktif',area:'',count:0,avg:0,status:'Pendataan awal'},
  {id:'K-03',name:'Kolam 03',fish:'Gurame',cycle:'Siklus aktif',area:'',count:0,avg:0,status:'Pendataan awal'},
  {id:'K-04',name:'Kolam 04',fish:'Nila',cycle:'Siklus aktif',area:'',count:0,avg:0,status:'Pendataan awal'},
  {id:'K-05',name:'Kolam 05',fish:'Mas',cycle:'Siklus aktif',area:'',count:0,avg:0,status:'Pendataan awal'},
  {id:'K-06',name:'Kolam 06',fish:'Gurame',cycle:'Siklus aktif',area:'',count:0,avg:0,status:'Pendataan awal'}
 ],
 stock:[], feeds:[], harvests:[], orders:[], expenses:[], customers:[],
 settings:{farmName:'BUTO FARM',whatsapp:'',location:'',tagline:'Sehat Ikannya, Sejahtera Bersama.'}
};
let nextId=1;
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const num=n=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fishEmoji=f=>f==='Mas'?'🐠':f==='Nila'?'🐟':'🐡';
const fishName=f=>f==='Mas'?'Ikan Mas':f==='Nila'?'Ikan Nila':'Ikan Gurame';
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—';
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',3000)}
function navigate(page){state.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=({dashboard:'Ringkasan',ponds:'Kolam & Siklus',stock:'Stok Ikan',feed:'Pakan & Biaya',harvest:'Panen',orders:'Pesanan & Penjualan',reports:'Laporan',website:'Pratinjau Website',settings:'Pengaturan'})[page]||page;$('#sidebar').classList.remove('open');render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});
document.querySelectorAll('.sidebar [data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
function pageHead(title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">BUTO FARM · PANEL PEMILIK</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,value,sub,icon){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><small>${sub}</small></div>`}
function panelHead(title,desc='',action=''){return `<div class="panel-head"><div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${action}</div>`}
function getReadyStock(fish){return state.harvests.filter(h=>h.fish===fish).reduce((s,h)=>s+Math.max(0,(Number(h.weight)||0)-(Number(h.soldWeight)||0)),0)}
function totalReady(){return state.harvests.reduce((s,h)=>s+Math.max(0,(Number(h.weight)||0)-(Number(h.soldWeight)||0)),0)}
function totalRevenue(){return state.orders.reduce((s,o)=>s+(Number(o.paid)||0),0)}
function totalExpenses(){return state.feeds.reduce((s,x)=>s+(Number(x.cost)||0),0)+state.expenses.reduce((s,x)=>s+(Number(x.cost)||0),0)}
function dashboard(){const active=state.ponds.length;const pending=state.orders.filter(o=>!['Selesai','Dibatalkan'].includes(o.status)).length;const outstanding=state.orders.reduce((s,o)=>s+Math.max(0,(Number(o.total)||0)-(Number(o.paid)||0)),0);
return `${pageHead('Ringkasan operasional','Pantau kolam, stok siap jual, pesanan, dan keuangan BUTO FARM.','<button class="btn primary" onclick="openModal(&quot;order&quot;)">＋ Pesanan baru</button>')}
<div class="stats">${stat('Kolam terdaftar',active,'Isi detail setiap kolam','≋')}${stat('Stok siap jual',num(totalReady())+' kg',state.harvests.length+' catatan panen','🐟')}${stat('Pesanan aktif',pending,'Perlu ditindaklanjuti','▤')}${stat('Piutang berjalan',money(outstanding),'Total belum dibayar','◷')}</div>
<div class="dashboard-grid"><div>
<div class="panel">${panelHead('Kolam & siklus budidaya','Contoh daftar awal — lengkapi data aktual','<button class="text-link" onclick="navigate(&quot;ponds&quot;)">Kelola kolam →</button>')}
<div class="pond-list">${state.ponds.slice(0,5).map(p=>`<div class="pond-row"><div class="pond-symbol">≋</div><div><b>${esc(p.id)} · ${esc(p.name)}</b><small>${fishName(p.fish)} · ${esc(p.area||'Luas belum dicatat')}</small></div><span class="tag ${p.count?'green':'amber'}">${p.count?'Data diisi':'Pendataan awal'}</span></div>`).join('')||'<div class="empty">Belum ada kolam. Tambahkan kolam pertama.</div>'}</div></div>
<div class="panel">${panelHead('Ringkasan stok siap jual','Berdasarkan catatan panen yang belum seluruhnya terjual','<button class="text-link" onclick="navigate(&quot;stock&quot;)">Lihat stok →</button>')}
${['Mas','Nila','Gurame'].map(f=>`<div class="bar-wrap"><div class="bar-label"><span>${fishName(f)}</span><span>${num(getReadyStock(f))} kg siap jual</span></div><div class="bar"><i style="width:${totalReady()?Math.min(100,getReadyStock(f)/totalReady()*100):0}%"></i></div></div>`).join('')}
<div class="notice"><span>ⓘ</span><span>Stok siap jual dihitung dari catatan panen dikurangi jumlah yang terjual. Ikan yang masih di kolam belum otomatis dianggap stok siap jual.</span></div></div>
</div><div>
<div class="panel">${panelHead('Aksi cepat','Pencatatan yang sering dipakai')}
<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><button class="btn" onclick="openModal(&quot;pond&quot;)">＋ Tambah kolam</button><button class="btn" onclick="openModal(&quot;feed&quot;)">＋ Catat pakan</button><button class="btn" onclick="openModal(&quot;harvest&quot;)">＋ Catat panen</button><button class="btn" onclick="openModal(&quot;order&quot;)">＋ Pesanan baru</button></div></div>
<div class="panel">${panelHead('Aktivitas terbaru','Perubahan terakhir yang dicatat')}
${recentActivity()}</div>
<div class="panel">${panelHead('Keuangan ringkas','Angka berdasarkan data yang sudah dimasukkan')}
<div class="bar-wrap"><div class="bar-label"><span>Pembayaran diterima</span><strong>${money(totalRevenue())}</strong></div></div>
<div class="bar-wrap"><div class="bar-label"><span>Biaya tercatat</span><strong>${money(totalExpenses())}</strong></div></div>
<div class="bar-wrap"><div class="bar-label"><span>Selisih kas sederhana</span><strong>${money(totalRevenue()-totalExpenses())}</strong></div></div><small style="color:var(--muted);font-size:10px">Belum termasuk seluruh biaya siklus atau penyesuaian persediaan; bukan laba final.</small></div>
</div></div>`}
function recentActivity(){const all=[...state.feeds.map(x=>({date:x.date,title:`Pakan ${x.pond}`,desc:`${num(x.kg)} kg · ${money(x.cost)}`})),...state.harvests.map(x=>({date:x.date,title:`Panen ${fishName(x.fish)}`,desc:`${num(x.weight)} kg tercatat`})),...state.orders.map(x=>({date:x.date,title:`Pesanan ${x.customer}`,desc:`${money(x.total)} · ${x.status}`}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);return all.length?all.map(x=>`<div style="display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)"><div class="pond-symbol" style="width:32px;height:32px;font-size:15px">•</div><div><b style="font-size:11px">${esc(x.title)}</b><small style="display:block;color:var(--muted);font-size:10px;margin-top:4px">${esc(x.desc)} · ${fmtDate(x.date)}</small></div></div>`).join(''):'<div class="empty">Belum ada aktivitas. Gunakan tombol aksi cepat untuk mulai mencatat.</div>'}
function pondsPage(){return `${pageHead('Kolam & siklus','Daftarkan kolam, jenis ikan, dan data siklus budidaya.','<button class="btn primary" onclick="openModal(&quot;pond&quot;)">＋ Tambah kolam</button>')}<div class="notice" style="margin:0 0 16px"><span>ⓘ</span><span>Enam ID kolam contoh sudah disiapkan sebagai titik awal. Sesuaikan nama, jenis ikan, dan detailnya dengan kondisi nyata. Kolam contoh belum berarti data stok telah diverifikasi.</span></div><div class="panel"><div class="toolbar"><input id="pondSearch" placeholder="Cari ID atau nama kolam..." oninput="filterRows('pondTable',this.value)"><select id="pondFishFilter" onchange="filterPonds(this.value)"><option value="">Semua jenis ikan</option><option>Mas</option><option>Nila</option><option>Gurame</option></select></div><div class="table-wrap"><table id="pondTable"><thead><tr><th>ID / Kolam</th><th>Jenis ikan</th><th>Luas</th><th>Populasi estimasi</th><th>Bobot rata-rata</th><th>Status data</th><th>Aksi</th></tr></thead><tbody>${state.ponds.map(p=>`<tr data-fish="${p.fish}"><td><strong>${esc(p.id)}</strong><br><small style="color:var(--muted)">${esc(p.name)}</small></td><td>${fishName(p.fish)}</td><td>${esc(p.area||'—')}</td><td>${p.count?num(p.count)+' ekor':'Belum diisi'}</td><td>${p.avg?num(p.avg)+' g':'—'}</td><td><span class="tag ${p.count&&p.avg?'green':'amber'}">${p.count&&p.avg?'Data diisi':'Pendataan awal'}</span></td><td><button class="btn small" onclick="openModal(&quot;pond&quot;,&quot;${p.id}&quot;)">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`}
function stockPage(){return `${pageHead('Stok ikan','Pisahkan estimasi ikan di kolam dari hasil panen yang siap dijual.','<button class="btn primary" onclick="openModal(&quot;sampling&quot;)">＋ Catat sampling</button>')}<div class="stats">${stat('Ikan Mas',num(getReadyStock('Mas'))+' kg','Stok panen tersisa','🐠')}${stat('Ikan Nila',num(getReadyStock('Nila'))+' kg','Stok panen tersisa','🐟')}${stat('Ikan Gurame',num(getReadyStock('Gurame'))+' kg','Stok panen tersisa','🐡')}${stat('Total siap jual',num(totalReady())+' kg','Hasil panen belum terjual','⚖')}</div><div class="panel">${panelHead('Estimasi populasi dalam kolam','Perkiraan dari jumlah ekor × bobot rata-rata; isi data sampling untuk mulai menghitung.')}<div class="table-wrap"><table><thead><tr><th>Kolam</th><th>Ikan</th><th>Estimasi ekor</th><th>Bobot rata-rata</th><th>Biomassa estimasi</th></tr></thead><tbody>${state.ponds.map(p=>`<tr><td><strong>${esc(p.id)}</strong></td><td>${fishName(p.fish)}</td><td>${p.count?num(p.count):'—'}</td><td>${p.avg?num(p.avg)+' g':'—'}</td><td>${p.count&&p.avg?num(p.count*p.avg/1000)+' kg':'Belum dihitung'}</td></tr>`).join('')}</tbody></table></div><div class="notice"><span>ⓘ</span><span>Estimasi biomassa bukan jaminan hasil panen. Perbarui sampling dan mortalitas, lalu konfirmasi ketersediaan sebelum menerima pesanan grosir.</span></div></div><div class="panel">${panelHead('Stok hasil panen siap jual','Sisa berat panen setelah alokasi penjualan')}<div class="table-wrap"><table><thead><tr><th>Tanggal panen</th><th>Jenis ikan</th><th>Berat awal</th><th>Terjual</th><th>Sisa (kg)</th></tr></thead><tbody>${state.harvests.length?state.harvests.map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${fishName(h.fish)}</td><td>${num(h.weight)} kg</td><td>${num(h.soldWeight)} kg</td><td><strong>${num(Math.max(0,h.weight-h.soldWeight))} kg</strong></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada data panen.</td></tr>'}</tbody></table></div></div>`}
function feedPage(){return `${pageHead('Pakan & biaya','Catat pemakaian pakan dan pengeluaran operasional.','<button class="btn primary" onclick="openModal(&quot;feed&quot;)">＋ Catat pakan</button>')}<div class="stats">${stat('Total pakan tercatat',num(state.feeds.reduce((s,x)=>s+Number(x.kg||0),0))+' kg','Semua catatan','◉')}${stat('Biaya pakan',money(state.feeds.reduce((s,x)=>s+Number(x.cost||0),0)),'Dari catatan pakan','↗')}${stat('Biaya lain',money(state.expenses.reduce((s,x)=>s+Number(x.cost||0),0)),'Pengeluaran operasional','▤')}${stat('Catatan biaya',state.feeds.length+state.expenses.length,'Pakan dan biaya lain','✓')}</div><div class="panel">${panelHead('Riwayat pemakaian pakan','Pilih kolam dan catat pakan sesuai pemakaian aktual')}<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kolam</th><th>Jenis pakan</th><th>Jumlah</th><th>Biaya</th><th>Catatan</th></tr></thead><tbody>${state.feeds.length?state.feeds.slice().reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.pond)}</td><td>${esc(x.kind)}</td><td>${num(x.kg)} kg</td><td>${money(x.cost)}</td><td>${esc(x.notes||'—')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada catatan pakan.</td></tr>'}</tbody></table></div></div><div class="panel">${panelHead('Pengeluaran lainnya','Benih, listrik, obat/perlakuan, tenaga kerja, transportasi, dan biaya lain.','<button class="btn" onclick="openModal(&quot;expense&quot;)">＋ Tambah biaya</button>')}<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kategori</th><th>Deskripsi</th><th>Jumlah</th></tr></thead><tbody>${state.expenses.length?state.expenses.slice().reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.notes||'—')}</td><td>${money(x.cost)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Belum ada biaya lain.</td></tr>'}</tbody></table></div></div>`}
function harvestPage(){return `${pageHead('Panen','Catat hasil timbang aktual. Panen menambah stok siap jual.','<button class="btn primary" onclick="openModal(&quot;harvest&quot;)">＋ Catat panen</button>')}<div class="stats">${stat('Jumlah catatan panen',state.harvests.length,'Semua jenis ikan','⚖')}${stat('Total hasil panen',num(state.harvests.reduce((s,h)=>s+Number(h.weight||0),0))+' kg','Berat hasil timbang','🐟')}${stat('Sudah terjual',num(state.harvests.reduce((s,h)=>s+Number(h.soldWeight||0),0))+' kg','Dari catatan penjualan','↗')}${stat('Sisa siap jual',num(totalReady())+' kg','Berat belum terjual','▤')}</div><div class="panel">${panelHead('Riwayat panen','Catat berat aktual dan jumlah ekor bila dihitung.')}<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kolam</th><th>Jenis ikan</th><th>Berat (kg)</th><th>Jumlah (ekor)</th><th>Catatan</th></tr></thead><tbody>${state.harvests.length?state.harvests.slice().reverse().map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${esc(h.pond)}</td><td>${fishName(h.fish)}</td><td><strong>${num(h.weight)}</strong></td><td>${h.count?num(h.count):'—'}</td><td>${esc(h.notes||'—')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada data panen.</td></tr>'}</tbody></table></div></div>`}
function ordersPage(){return `${pageHead('Pesanan & penjualan','Kelola permintaan pengepul, konfirmasi, pengiriman, dan pembayaran.','<button class="btn primary" onclick="openModal(&quot;order&quot;)">＋ Pesanan baru</button>')}<div class="stats">${stat('Total pesanan',state.orders.length,'Semua status','▤')}${stat('Nilai pesanan',money(state.orders.reduce((s,o)=>s+Number(o.total||0),0)),'Total nilai tercatat','↗')}${stat('Pembayaran diterima',money(totalRevenue()),'Total pembayaran masuk','✓')}${stat('Piutang',money(state.orders.reduce((s,o)=>s+Math.max(0,Number(o.total||0)-Number(o.paid||0)),0)),'Belum dibayar','◷')}</div><div class="panel">${panelHead('Daftar pesanan','Untuk MVP, satu pesanan berisi satu jenis ikan. Multi-produk dapat ditambahkan pada versi berikutnya.')}<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Pembeli</th><th>Produk</th><th>Jumlah</th><th>Total</th><th>Dibayar</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${state.orders.length?state.orders.slice().reverse().map(o=>`<tr><td>${fmtDate(o.date)}</td><td><strong>${esc(o.customer)}</strong><br><small style="color:var(--muted)">${esc(o.phone||'')}</small></td><td>${fishName(o.fish)}</td><td>${num(o.qty)} ${o.unit}</td><td>${money(o.total)}</td><td>${money(o.paid)}</td><td><span class="tag ${o.status==='Selesai'?'green':o.status==='Dibatalkan'?'gray':'amber'}">${esc(o.status)}</span></td><td><button class="btn small" onclick="openModal(&quot;order&quot;,&quot;${o.id}&quot;)">Ubah</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">Belum ada pesanan. Tambahkan pesanan pertama untuk mulai mencatat penjualan.</td></tr>'}</tbody></table></div></div>`}
function reportsPage(){const rev=state.orders.reduce((s,o)=>s+Number(o.total||0),0),paid=totalRevenue(),cost=totalExpenses();return `${pageHead('Laporan usaha','Ringkasan berdasarkan data yang telah dimasukkan. Periksa kelengkapan biaya sebelum menilai laba.','<button class="btn" onclick="exportCSV()">↓ Ekspor CSV</button>')}<div class="stats">${stat('Nilai penjualan',money(rev),'Nilai seluruh pesanan','↗')}${stat('Pembayaran masuk',money(paid),'Kas diterima','✓')}${stat('Piutang',money(rev-paid),'Nilai pesanan dikurangi pembayaran','◷')}${stat('Biaya tercatat',money(cost),'Pakan dan pengeluaran lain','▤')}</div><div class="panel">${panelHead('Penjualan per jenis ikan','Berdasarkan nilai pesanan, bukan hanya uang yang telah diterima')}<div class="table-wrap"><table><thead><tr><th>Komoditas</th><th>Jumlah pesanan</th><th>Volume pesanan</th><th>Nilai pesanan</th><th>Stok panen tersisa</th></tr></thead><tbody>${['Mas','Nila','Gurame'].map(f=>{const arr=state.orders.filter(o=>o.fish===f);return `<tr><td><strong>${fishName(f)}</strong></td><td>${arr.length}</td><td>${num(arr.reduce((s,o)=>s+Number(o.qty||0),0))} ${arr[0]?.unit||'—'}</td><td>${money(arr.reduce((s,o)=>s+Number(o.total||0),0))}</td><td>${num(getReadyStock(f))} kg</td></tr>`}).join('')}</tbody></table></div></div><div class="panel">${panelHead('Catatan interpretasi')}<div class="notice"><span>ⓘ</span><span>Selisih pembayaran dan biaya belum tentu sama dengan laba bersih. Untuk laporan laba yang lebih akurat, masukkan biaya benih, pakan, listrik, tenaga kerja, obat/perlakuan, transportasi, dan biaya relevan lainnya per siklus. Hindari menghitung biaya yang sama dua kali.</span></div></div>`}
function websitePage(){return `${pageHead('Pratinjau website publik','Contoh tampilan yang akan dilihat calon pengepul dan pedagang grosir.','<button class="btn" onclick="navigate(&quot;settings&quot;)">Atur kontak</button>')}<div class="public-preview"><div class="eyebrow">BUDIDAYA IKAN AIR TAWAR</div><h2>Mitra terpercaya penyedia ikan mas, nila, dan gurame.</h2><p>BUTO FARM melayani kebutuhan ikan air tawar untuk pengepul dan pedagang grosir. Hubungi kami untuk informasi ukuran, ketersediaan panen, harga, dan pengiriman.</p><button class="btn primary" onclick="contactWhatsApp()">◉ Minta penawaran via WhatsApp</button><div class="public-product-row">${['Mas','Nila','Gurame'].map(f=>`<div class="public-product"><div>${fishEmoji(f)}</div><b>${fishName(f)}</b><small>Ukuran dan ketersediaan dikonfirmasi saat penawaran.</small></div>`).join('')}</div></div><div class="panel">${panelHead('Informasi penting untuk calon pembeli')}<div class="stats" style="margin:0">${stat('Komoditas','3','Ikan mas, nila, gurame','🐟')}${stat('Sistem pemesanan','Grosir','Harga melalui penawaran','▤')}${stat('Stok publik','Konfirmasi','Tidak menjanjikan stok otomatis','✓')}${stat('Kontak','WhatsApp','Isi nomor di pengaturan','◉')}</div></div>`}
function settingsPage(){return `${pageHead('Pengaturan usaha','Informasi dasar yang akan dipakai di website publik dan pesan WhatsApp.')}<div class="panel settings-card">${panelHead('Profil BUTO FARM','Pastikan nomor WhatsApp menggunakan kode negara, misalnya 62812xxxxxxx.')}<form id="settingsForm" onsubmit="saveSettings(event)"><div class="field"><label>Nama usaha</label><input name="farmName" value="${esc(state.settings.farmName)}" required></div><div class="field"><label>Slogan</label><input name="tagline" value="${esc(state.settings.tagline)}"></div><div class="field"><label>Nomor WhatsApp (format internasional)</label><input name="whatsapp" value="${esc(state.settings.whatsapp)}" placeholder="62812xxxxxxxx"></div><div class="field"><label>Lokasi peternakan</label><input name="location" value="${esc(state.settings.location)}" placeholder="Desa, kecamatan, kabupaten"></div><button class="btn primary" type="submit">Simpan pengaturan</button></form><div class="notice"><span>ⓘ</span><span>Versi HTML ini menyimpan data sementara di memori halaman. Data akan hilang jika halaman dimuat ulang. Untuk penggunaan nyata, perlu database, login aman, dan pencadangan.</span></div></div>`}
function render(){const map={dashboard,ponds:pondsPage,stock:stockPage,feed:feedPage,harvest:harvestPage,orders:ordersPage,reports:reportsPage,website:websitePage,settings:settingsPage};$('#content').innerHTML=(map[state.page]||dashboard)()}
function filterRows(id,value){const q=value.toLowerCase();document.querySelectorAll(`#${id} tbody tr`).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function filterPonds(v){document.querySelectorAll('#pondTable tbody tr').forEach(r=>r.style.display=!v||r.dataset.fish===v?'':'none')}
function openModal(type,id=null){const edit=id?(type==='pond'?state.ponds.find(x=>x.id===id):type==='order'?state.orders.find(x=>x.id===id):null):null;let title='',body='';
const date=new Date().toISOString().slice(0,10);
const field=(label,name,opts={})=>`<div class="field ${opts.full?'full':''}"><label>${label}</label>${opts.select?`<select name="${name}" ${opts.required?'required':''}>${opts.select.map(o=>`<option value="${esc(o.value)}" ${o.value===opts.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:opts.textarea?`<textarea name="${name}" rows="3" placeholder="${opts.placeholder||''}">${esc(opts.value||'')}</textarea>`:`<input name="${name}" type="${opts.type||'text'}" value="${esc(opts.value??'')}" placeholder="${opts.placeholder||''}" ${opts.required?'required':''} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.step?`step="${opts.step}"`:''}>`}</div>`;
const pondOpts=state.ponds.map(p=>({value:p.id,label:p.id+' · '+p.name}));
if(type==='pond'){title=edit?'Edit kolam':'Tambah kolam';body=field('ID kolam','id',{value:edit?.id||`K-${String(state.ponds.length+1).padStart(2,'0')}`,required:true})+field('Nama kolam','name',{value:edit?.name||'',required:true})+field('Jenis ikan','fish',{select:[{value:'Mas',label:'Ikan Mas'},{value:'Nila',label:'Ikan Nila'},{value:'Gurame',label:'Ikan Gurame'}],value:edit?.fish||'Nila',required:true})+field('Luas / volume (opsional)','area',{value:edit?.area||'',placeholder:'Contoh: 400 m²'})+field('Estimasi populasi (ekor)','count',{type:'number',min:0,value:edit?.count||0})+field('Bobot rata-rata (gram/ekor)','avg',{type:'number',min:0,step:'0.1',value:edit?.avg||0})+field('Catatan','notes',{textarea:true,full:true,placeholder:'Tanggal tebar, asal benih, atau kondisi kolam'})}
if(type==='feed'){title='Catat pemakaian pakan';body=field('Tanggal','date',{type:'date',value:date,required:true})+field('Kolam','pond',{select:pondOpts,required:true})+field('Jenis pakan','kind',{placeholder:'Contoh: pelet apung',required:true})+field('Jumlah (kg)','kg',{type:'number',min:0,step:'0.1',required:true})+field('Biaya total (Rp)','cost',{type:'number',min:0,required:true})+field('Catatan','notes',{textarea:true,full:true})}
if(type==='expense'){title='Tambah biaya operasional';body=field('Tanggal','date',{type:'date',value:date,required:true})+field('Kategori','category',{select:['Benih','Listrik','Obat/perlakuan','Tenaga kerja','Transportasi','Perawatan kolam','Lainnya'].map(x=>({value:x,label:x})),required:true})+field('Jumlah biaya (Rp)','cost',{type:'number',min:0,required:true})+field('Deskripsi','notes',{placeholder:'Contoh: pembelian benih nila',full:true})}
if(type==='sampling'){title='Catat sampling ikan';body=field('Tanggal','date',{type:'date',value:date,required:true})+field('Kolam','pond',{select:pondOpts,required:true})+field('Estimasi populasi tersisa (ekor)','count',{type:'number',min:0,required:true})+field('Bobot rata-rata (gram/ekor)','avg',{type:'number',min:0,step:'0.1',required:true})+field('Jumlah ikan mati ditemukan (ekor)','mortality',{type:'number',min:0,value:0,required:true})+field('Catatan sampling','notes',{textarea:true,full:true})}
if(type==='harvest'){title='Catat hasil panen';body=field('Tanggal panen','date',{type:'date',value:date,required:true})+field('Kolam','pond',{select:pondOpts,required:true})+field('Jenis ikan','fish',{select:[{value:'Mas',label:'Ikan Mas'},{value:'Nila',label:'Ikan Nila'},{value:'Gurame',label:'Ikan Gurame'}],required:true})+field('Berat hasil timbang (kg)','weight',{type:'number',min:0,step:'0.01',required:true})+field('Jumlah ekor (jika dihitung)','count',{type:'number',min:0})+field('Catatan','notes',{textarea:true,full:true})}
if(type==='order'){title=edit?'Ubah pesanan':'Pesanan baru';body=field('Tanggal','date',{type:'date',value:edit?.date||date,required:true})+field('Nama pembeli','customer',{value:edit?.customer||'',required:true})+field('Nomor WhatsApp','phone',{value:edit?.phone||'',placeholder:'62812xxxxxxx'})+field('Jenis ikan','fish',{select:[{value:'Mas',label:'Ikan Mas'},{value:'Nila',label:'Ikan Nila'},{value:'Gurame',label:'Ikan Gurame'}],value:edit?.fish||'Nila',required:true})+field('Jumlah','qty',{type:'number',min:0,step:'0.01',value:edit?.qty||'',required:true})+field('Satuan','unit',{select:[{value:'kg',label:'Kilogram (kg)'},{value:'ekor',label:'Ekor'}],value:edit?.unit||'kg',required:true})+field('Harga per satuan (Rp)','price',{type:'number',min:0,value:edit?.price||'',required:true})+field('Pembayaran diterima (Rp)','paid',{type:'number',min:0,value:edit?.paid||0,required:true})+field('Status pesanan','status',{select:['Permintaan','Dikonfirmasi','Dijadwalkan','Dipanen','Dikirim','Selesai','Dibatalkan'].map(x=>({value:x,label:x})),value:edit?.status||'Permintaan',required:true})+field('Catatan / lokasi pengiriman','notes',{textarea:true,full:true,value:edit?.notes||''})}
$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><form id="entryForm"><div class="form-grid">${body}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary" type="submit">Simpan catatan</button></div></form></div></div>`;
$('#entryForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());Object.keys(d).forEach(k=>{if(['count','avg','kg','cost','weight','qty','price','paid','mortality'].includes(k))d[k]=Number(d[k]||0)});
if(type==='pond'){if(!edit&&state.ponds.some(p=>p.id===d.id)){toast('ID kolam sudah digunakan.');return}if(edit)Object.assign(edit,d);else state.ponds.push({...d,status:'Pendataan awal'})}
if(type==='feed')state.feeds.push({...d,id:nextId++});
if(type==='expense')state.expenses.push({...d,id:nextId++});
if(type==='sampling'){const p=state.ponds.find(p=>p.id===d.pond);if(p){p.count=d.count;p.avg=d.avg;p.status='Data diisi'}state.stock.push({...d,id:nextId++});}
if(type==='harvest')state.harvests.push({...d,soldWeight:0,id:nextId++});
if(type==='order'){d.total=d.qty*d.price;d.id=edit?edit.id:nextId++;if(edit)Object.assign(edit,d);else state.orders.push(d)}
closeModal();render();toast('Catatan berhasil ditambahkan pada sesi ini.')};
}
function closeModal(){$('#modalRoot').innerHTML=''}
function saveSettings(e){e.preventDefault();Object.assign(state.settings,Object.fromEntries(new FormData(e.target).entries()));toast('Pengaturan tersimpan untuk sesi ini.')}
function contactWhatsApp(){const phone=(state.settings.whatsapp||'').replace(/\D/g,'');const msg=encodeURIComponent('Halo BUTO FARM, saya ingin meminta penawaran grosir ikan mas, nila, atau gurame. Mohon info ukuran, stok tersedia, harga, dan pengiriman.');if(!phone){toast('Isi nomor WhatsApp di menu Pengaturan terlebih dahulu.');navigate('settings');return}window.open(`https://wa.me/${phone}?text=${msg}`,'_blank','noopener')}
function exportCSV(){const rows=[['Tanggal','Pembeli','Jenis ikan','Jumlah','Satuan','Harga per satuan','Total','Dibayar','Status'],...state.orders.map(o=>[o.date,o.customer,o.fish,o.qty,o.unit,o.price,o.total,o.paid,o.status])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='buto-farm-penjualan.csv';a.click();URL.revokeObjectURL(a.href);toast('Laporan CSV dibuat.')}
render();
</script>
</body>
</html>
